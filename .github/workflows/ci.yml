name: CI

# 올릴 때마다: PHP 문법, 데이터베이스 구조 적용(빈 DB 에 처음부터), 화면 타입 검사와 빌드.
# 통합 시험(tests/m*_flow.py)은 교적(ch-manage)이 설치된 개발 DB 가 있어야 해서 내 컴퓨터에서 돌린다. (README 의 '개발' 참고)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: fm_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, gd

      - name: PHP 문법 검사
        run: find server tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: 데이터베이스 구조 적용 확인 (빈 DB → 최신)
        run: php tests/migrate_check.php 127.0.0.1 fm_ci root ""

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: 화면 타입 검사
        run: npm run check
      - name: 화면 빌드
        run: npm run build
